[project]
name = "harpocrate"
# Version lue dans harpocrate/__init__.py (`__version__`) : une seule source, que le
# workflow de publication compare au tag `sdk-python-v<version>` avant tout upload.
dynamic = ["version"]
description = "Client Python zero-knowledge pour le coffre de secrets Harpocrate : chiffrement côté client, le serveur ne voit jamais une valeur"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gaelgael5" }]
keywords = ["secrets", "vault", "zero-knowledge", "encryption", "harpocrate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "argon2-cffi>=23",
    "bcrypt>=4.1",
    "pydantic>=2.6",
    "click>=8.1",
    "cachetools>=5.3",
    "joserfc>=1.7",
]

[project.urls]
Homepage = "https://github.com/gaelgael5/harpocrate"
Source = "https://github.com/gaelgael5/harpocrate/tree/main/sdk-python"
Changelog = "https://github.com/gaelgael5/harpocrate/blob/main/sdk-python/CHANGELOG.md"
Issues = "https://github.com/gaelgael5/harpocrate/issues"

[project.scripts]
harpocrate-gen = "harpocrate.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-cachetools>=5.3",
]

[build-system]
# >= 1.27 : métadonnées 2.4 (`license` en expression SPDX + `license-files`, PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "harpocrate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["harpocrate"]

# Le sdist publié sur PyPI ne porte que ce qui sert à reconstruire et vérifier le
# paquet : sans liste explicite, hatchling y verse aussi les caches et le venv locaux.
[tool.hatch.build.targets.sdist]
include = ["harpocrate/", "tests/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = false
