###############################################################################
# docker-compose.yml — Stack PROD Harpocrate.
#
# Ce fichier est le compose officiel pour le déploiement serveur (LXC, K8s,
# bare metal). Il pull les images PRÉ-BUILDÉES depuis GHCR — pas de build
# local, pas de bind du code source.
#
# Variables d'env :
#   TAG                 = tag de l'image GHCR (défaut "latest", peut être
#                         override : `TAG=v1.2.0 docker compose up -d`).
#   POSTGRES_*          = credentials DB (.env)
#   HARPOCRATE_*        = config app (.env, voir .env.example)
#
# Pour le DEV LOCAL : `docker-compose.override.yml` (auto-loaded par Compose
# quand il existe à côté du compose principal) override les images GHCR pour
# build localement avec target=dev + bind code source. Sur le serveur, ce
# fichier override n'existe PAS donc seul ce compose est utilisé.
###############################################################################

services:
  postgres:
    image: postgres:16-alpine
    container_name: harpocrate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: ghcr.io/gaelgael5/harpocrate-backend:${TAG:-latest}
    container_name: harpocrate-backend
    restart: unless-stopped
    # Drain de 30s respecté par uvicorn (LOT 21A graceful shutdown) +
    # marge de 5s pour les fermetures pool DB / cluster sync stop.
    stop_grace_period: 35s
    stop_signal: SIGTERM
    environment:
      HARPOCRATE_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HARPOCRATE_KEYCLOAK_URL: ${HARPOCRATE_KEYCLOAK_URL}
      HARPOCRATE_KEYCLOAK_REALM: ${HARPOCRATE_KEYCLOAK_REALM}
      HARPOCRATE_KEYCLOAK_CLIENT_ID: ${HARPOCRATE_KEYCLOAK_CLIENT_ID}
      HARPOCRATE_HMAC_KEY: ${HARPOCRATE_HMAC_KEY}
      HARPOCRATE_PUBLIC_URL: ${HARPOCRATE_PUBLIC_URL}
      HARPOCRATE_LOG_LEVEL: ${HARPOCRATE_LOG_LEVEL:-INFO}
      HARPOCRATE_ADMIN_LOCAL_ENABLED: ${HARPOCRATE_ADMIN_LOCAL_ENABLED:-false}
      HARPOCRATE_ADMIN_LOCAL_USERNAME: ${HARPOCRATE_ADMIN_LOCAL_USERNAME:-}
      HARPOCRATE_ADMIN_LOCAL_PASSWORD: ${HARPOCRATE_ADMIN_LOCAL_PASSWORD:-}
      HARPOCRATE_ADMIN_LOCAL_EMAIL: ${HARPOCRATE_ADMIN_LOCAL_EMAIL:-admin@harpocrate.local}
      HARPOCRATE_ADMIN_LOCAL_DISPLAY_NAME: ${HARPOCRATE_ADMIN_LOCAL_DISPLAY_NAME:-Local Admin}
      HARPOCRATE_DEV_MODE: ${HARPOCRATE_DEV_MODE:-false}
      HARPOCRATE_DEV_MODE_LABEL: ${HARPOCRATE_DEV_MODE_LABEL:-DEV}
      # listmonk (LOT_57) — provider d'envoi de mails transactional.
      HARPOCRATE_LISTMONK_URL: ${HARPOCRATE_LISTMONK_URL:-}
      HARPOCRATE_LISTMONK_USER: ${HARPOCRATE_LISTMONK_USER:-}
      HARPOCRATE_LISTMONK_TOKEN: ${HARPOCRATE_LISTMONK_TOKEN:-}
      HARPOCRATE_LISTMONK_TEMPLATE_RECOVERY_FR: ${HARPOCRATE_LISTMONK_TEMPLATE_RECOVERY_FR:-4}
      HARPOCRATE_LISTMONK_TEMPLATE_RECOVERY_EN: ${HARPOCRATE_LISTMONK_TEMPLATE_RECOVERY_EN:-5}
      # Recovery passphrase tuning (LOT_57) — defaults raisonnables.
      HARPOCRATE_RECOVERY_SESSION_TTL_MINUTES: ${HARPOCRATE_RECOVERY_SESSION_TTL_MINUTES:-30}
      HARPOCRATE_RECOVERY_MAX_ATTEMPTS: ${HARPOCRATE_RECOVERY_MAX_ATTEMPTS:-3}
      HARPOCRATE_RECOVERY_ANOMALY_THRESHOLD: ${HARPOCRATE_RECOVERY_ANOMALY_THRESHOLD:-5}
      HARPOCRATE_RECOVERY_ANOMALY_WINDOW_HOURS: ${HARPOCRATE_RECOVERY_ANOMALY_WINDOW_HOURS:-24}
      # Réplication — appairage inter-instances (LOT 5). Défaut strict
      # (verify TLS activé). Mettre à true uniquement en dev pour autoriser
      # les certs auto-signés sur /pairing/confirm-v2.
      HARPOCRATE_REPLICATION_INSECURE_SKIP_TLS_VERIFY: ${HARPOCRATE_REPLICATION_INSECURE_SKIP_TLS_VERIFY:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Cross-app launcher menu — éditable côté serveur sans rebuild
      - ./apps.json:/app/apps.json:ro
      # Artefacts SDK Python + CLI bash — exposés via /v1/sdk/*
      - ./releases:/app/releases:ro
      # Backups locaux .tar.age — persistent à travers les pulls/restarts.
      # Le dossier ./backups est créé + chown 1001:1001 automatiquement
      # par scripts/refresh.sh à chaque exécution (idempotent).
      - ./backups:/var/lib/harpocrate/backups
    healthcheck:
      # Python est garanti dans l'image (pas curl). urllib renvoie le status :
      # 200 → OK, autre → exit 1 → Docker marque unhealthy.
      test:
        - "CMD-SHELL"
        - >-
          python -c "import urllib.request,sys;
          r=urllib.request.urlopen('http://127.0.0.1:8000/v1/health',timeout=3);
          sys.exit(0 if r.status==200 else 1)" || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/gaelgael5/harpocrate-frontend:${TAG:-latest}
    container_name: harpocrate-frontend
    restart: unless-stopped
    # nginx flush rapide, pas de longue requête en cours.
    stop_grace_period: 10s
    depends_on:
      backend:
        # Attente du healthcheck backend → frontend ne sert PAS de 502
        # pendant le démarrage du backend (migrations + JWKS prefetch).
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
      - "0.0.0.0:8443:443"
    healthcheck:
      # nginx:alpine fournit wget. Port 80 redirige 301 → wget --spider
      # considère 301 comme succès → suffit à valider que nginx écoute.
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
