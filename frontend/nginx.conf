server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Proxy /v1/* directement vers le backend FastAPI.
    # Le frontend appelle /v1/* (meme path qu'en dev avec le proxy Vite),
    # nginx forward sans rewrite vers backend:8000/v1/*.
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compatibilite : /api/v1/* avec rewrite vers /v1/* sur le backend.
    # Conserve pour les outils externes ou clients qui utilisent ce prefixe.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets versionnes (Vite ajoute un hash dans le nom)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback : toute autre route sert index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
