[package]
name = "harpocrate"
version = "0.2.0"
edition = "2021"
description = "Harpocrate SDK — client Rust zero-knowledge pour Vault"
license = "MIT"
repository = "https://github.com/gaelgael5/harpocrate"
readme = "README.md"
keywords = ["vault", "secrets", "harpocrate", "encryption"]
categories = ["api-bindings", "cryptography"]

[dependencies]
aes-gcm = "0.10"
base32 = "0.5"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6"
