# Map pour propager le Connection: Upgrade quand le client demande un
# WebSocket. Sans ça, nginx forward la requête de handshake en HTTP/1.0
# classique → FastAPI ne trouve pas la route websocket et retourne 404.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Server HTTP (port 80, binde sur :8080 cote hote) — redirige vers HTTPS.
# La crypto navigateur exige un secure context (HTTPS ou localhost), donc
# l'app n'est pas servable utilement en HTTP plain : on redirige plutot que
# de servir une UI qui plantera sur crypto.subtle.
server {
    listen 80;
    server_name _;
    # Reconstruit l'URL HTTPS avec le port externe attendu (8443 par defaut).
    # $http_host inclut deja le port HTTP (ex: 192.168.10.123:8080) — on le
    # remplace via $server_name + un port fixe via map plus bas si besoin.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 10m;

    # Cert self-signed genere au build (Dockerfile stage prod) — usage dev/test.
    # En prod, terminer le TLS sur Cloudflare Tunnel et garder ce nginx en HTTP.
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Proxy /v1/* directement vers le backend FastAPI.
    # Le frontend appelle /v1/* (meme path qu'en dev avec le proxy Vite),
    # nginx forward sans rewrite vers backend:8000/v1/*.
    #
    # `add_header always` applique aussi sur les 5xx → empeche Cloudflare
    # de mettre en cache un 502 pendant un restart backend (sinon vault
    # continue de servir du 502 plusieurs minutes apres que l'origine
    # est revenue, cf incident 2026-05-06).
    location /v1/ {
        proxy_pass http://backend:8000;
        # Support WebSocket (pairing exec, terminaux interactifs). Sans
        # `proxy_http_version 1.1` + headers Upgrade/Connection, nginx
        # forward le handshake en HTTP/1.0 et FastAPI répond 404.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeout long pour les WS (pairing exec peut prendre plusieurs
        # minutes, notamment pg_basebackup sur une grosse base).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    # Compatibilite : /api/v1/* avec rewrite vers /v1/* sur le backend.
    # Conserve pour les outils externes ou clients qui utilisent ce prefixe.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Assets versionnes (Vite ajoute un hash dans le nom)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback : toute autre route sert index.html.
    # `no-store` ici aussi pour eviter que Cloudflare cache un index.html
    # transitoire ou une page d'erreur. Les /assets/ gardent leur cache long
    # (block au-dessus, add_header heritage = local au block en nginx).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
