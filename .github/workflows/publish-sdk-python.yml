name: publish-sdk-python

# Publication du SDK Python `harpocrate` sur PyPI.
#
# - tag `sdk-python-v<version>` (commit présent sur `main`) → pypi.org ;
# - lancement manuel (`workflow_dispatch`) → test.pypi.org, pour répéter le circuit.
#
# Authentification par Trusted Publishing (OIDC) : PyPI fait confiance à CE fichier de
# workflow et à l'environnement GitHub déclaré chez lui. Aucun jeton d'API PyPI n'existe,
# ni dans le dépôt ni dans les secrets GitHub — ne pas en ajouter : c'est la posture
# « aucun secret stocké » du projet, et un jeton volé publierait sans passer par la CI.
#
# Le préfixe `sdk-python-v` est délibérément distinct de `v*`, qui déclenche
# `build-images.yml` (images Docker) : sortir le SDK ne doit pas reconstruire les images.

on:
  push:
    tags: ['sdk-python-v*']
  workflow_dispatch:

permissions:
  contents: read

# Deux publications de la même référence ne doivent jamais s'entrelacer (wheel d'un run,
# sdist de l'autre) ; on n'annule pas non plus un run en cours qui aurait déjà uploadé.
concurrency:
  group: publish-sdk-python-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: sdk-python

jobs:
  check:
    name: Vérifications (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      # Doit suivre les classifiers et `requires-python` de pyproject.toml.
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Dépendances (lockfile figé)
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check harpocrate tests

      - name: ruff format --check
        run: uv run ruff format --check harpocrate tests

      - name: mypy
        run: uv run mypy harpocrate

      - name: pytest
        run: uv run pytest -q

  build:
    name: Construction et contrôle des distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet : nécessaire pour vérifier que le tag est sur `main`.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'

      # Une version publiée sur PyPI ne se reprend pas : seul ce qui a été fusionné sur
      # `main` (donc relu par l'humain) peut partir sur pypi.org. La répétition TestPyPI,
      # elle, peut partir de n'importe quelle branche.
      - name: Le tag désigne un commit de main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne désigne pas un commit de main : publication refusée."
            exit 1
          fi

      - name: Construction (wheel + sdist)
        run: uv build

      # La version vient de harpocrate/__init__.py ; le tag doit la nommer exactement,
      # sinon on publierait sous un numéro que personne n'a choisi pour ce tag.
      - name: Version du tag = version construite
        if: github.event_name == 'push'
        run: |
          expected="${GITHUB_REF_NAME#sdk-python-v}"
          wheel="dist/harpocrate-${expected}-py3-none-any.whl"
          sdist="dist/harpocrate-${expected}.tar.gz"
          if [ ! -f "$wheel" ] || [ ! -f "$sdist" ]; then
            echo "::error::Le tag annonce ${expected} mais la construction a produit : $(ls dist | tr '\n' ' ')"
            exit 1
          fi

      - name: Métadonnées conformes (twine check --strict)
        run: uvx twine check --strict dist/*

      # On installe le wheel CONSTRUIT dans un environnement vierge, hors du dépôt : un
      # import qui réussit dans le checkout peut masquer un fichier oublié par le build.
      - name: Le wheel s'installe et s'importe dans un environnement neuf
        run: |
          smoke="$RUNNER_TEMP/smoke"
          uv venv "$smoke" --python 3.12
          uv pip install --python "$smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke/bin/python" -c "import harpocrate; from harpocrate import VaultClient, connect; print(harpocrate.__version__)"
          "$smoke/bin/harpocrate-gen" --help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-python-dist
          path: sdk-python/dist/
          if-no-files-found: error

  # Les jobs de publication ne reconstruisent rien : ils uploadent les fichiers du job
  # `build`, vérifiés ci-dessus. `id-token: write` n'existe que sur eux.
  publish-testpypi:
    name: Publication sur TestPyPI (répétition)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/harpocrate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # Une répétition se rejoue sans bump de version : un fichier déjà présent sur
          # TestPyPI n'est pas une erreur. Jamais sur pypi.org (job suivant).
          skip-existing: true

  publish-pypi:
    name: Publication sur PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/harpocrate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
