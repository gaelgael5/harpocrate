# Mosquitto config pour réplication Harpocrate (LOT_21B).
# Persistance + auth password obligatoire.

listener 1883 0.0.0.0
protocol mqtt

# Persistance des sessions (clean_session=false côté clients)
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice

# Auth obligatoire — pas de guests
allow_anonymous false
password_file /mosquitto/config/passwords

# Limites raisonnables
max_inflight_messages 200
max_queued_messages 10000
message_size_limit 10485760  # 10 MB max par message
